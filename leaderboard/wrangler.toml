name = "agent-office-leaderboard"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# Create the database with `npx wrangler d1 create agent-office-leaderboard`,
# then paste the id it prints here.
[[d1_databases]]
binding = "DB"
database_name = "agent-office-leaderboard"
database_id = "REPLACE_WITH_THE_ID_FROM_WRANGLER"
