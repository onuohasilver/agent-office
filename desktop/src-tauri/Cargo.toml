[package]
name = "agent-office"
version = "0.9.0"
description = "A 3D office where the staff are Claude Code agents."
license = "MIT"
edition = "2021"

[lib]
name = "agent_office_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde_json = "1"
sha2 = "0.10"
getrandom = "0.3"
tauri-plugin-single-instance = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
