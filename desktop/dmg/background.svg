<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f2e8"/>
      <stop offset="1" stop-color="#eadfcc"/>
    </linearGradient>
    <radialGradient id="glowL" cx="165" cy="190" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="495" cy="190" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e0a27c" stop-opacity=".45"/>
      <stop offset="1" stop-color="#e0a27c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#b9a68a" opacity=".35"/>
    </pattern>
    <marker id="head" markerWidth="12" markerHeight="12" refX="7" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L10 6 L1 11" fill="none" stroke="#c4663a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="660" height="400" fill="url(#bg)"/>
  <rect width="660" height="400" fill="url(#grid)"/>
  <rect width="660" height="400" fill="url(#glowL)"/>
  <rect width="660" height="400" fill="url(#glowR)"/>

  <!-- header -->
  <g font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="330" y="58" font-size="26" font-weight="700" fill="#1c1b19" letter-spacing="-.4">Welcome to Agent Office</text>
    <text x="330" y="82" font-size="13.5" fill="#6d6455">A 3D office where the staff are Claude Code agents</text>
  </g>

  <!-- drop zone ring around Applications -->
  <circle cx="495" cy="190" r="84" fill="none" stroke="#c4663a" stroke-opacity=".35" stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round"/>

  <!-- arrow -->
  <path d="M236 160 C 285 112, 375 112, 418 154" fill="none" stroke="#c4663a" stroke-width="3.5" stroke-dasharray="1 9" stroke-linecap="round" opacity=".6"/>
  <path d="M414.9 138.3 L418 154 L402.2 151.2" fill="none" stroke="#c4663a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- instruction pill -->
  <g font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <rect x="190" y="318" width="280" height="38" rx="19" fill="#1c1b19"/>
    <text x="330" y="342" font-size="14" font-weight="600" fill="#f8f2e8">Drag Agent Office onto Applications</text>
    <text x="330" y="384" font-size="11" fill="#8a7f6c">Then open it from Launchpad. First launch may need right-click → Open.</text>
  </g>
</svg>
