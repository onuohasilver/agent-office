<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Office</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #14161c; color: #e8e6e1;
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Inter", sans-serif; }
  main { max-width: 34rem; padding: 2rem; text-align: center; }
  h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 .5rem; }
  p { margin: 0; color: #a9a6a0; }
  pre { text-align: left; white-space: pre-wrap; background: #0d0e12; padding: .75rem 1rem;
        border-radius: 8px; color: #e8a0a0; font-size: 12px; max-height: 40vh; overflow: auto; }
  .dot { display: inline-block; width: .5rem; height: .5rem; border-radius: 50%; background: #7aa2f7;
         margin-right: .5rem; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
</style>
</head>
<body>
<main>
  <h1 id="title"><span class="dot"></span>Opening the office…</h1>
  <p id="detail">Starting the server.</p>
</main>
<script>
  // The shell calls these while the server starts.
  window.officeStatus = (text) => { document.getElementById('detail').textContent = text; };
  window.officeError = (title, detail) => {
    document.getElementById('title').textContent = title;
    const p = document.getElementById('detail');
    p.replaceChildren();
    const pre = document.createElement('pre');
    pre.textContent = detail;
    p.append(pre);
  };
</script>
</body>
</html>
