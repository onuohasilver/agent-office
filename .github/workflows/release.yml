name: Release

# Push a tag like v0.2.0 to publish that version to npm. The tag must match
# package.json's version, and CI's checks run again first.

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # the GitHub release
  id-token: write   # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME but package.json says $v"; exit 1; }
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: sh scripts/pack-smoke.sh
      - name: Publish to npm
        # A version published by hand already is left alone.
        run: |
          name=$(node -p "require('./package.json').name")
          v=$(node -p "require('./package.json').version")
          if npm view "$name@$v" version > /dev/null 2>&1; then echo "$name@$v is already on npm"; exit 0; fi
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 && exit 0
          # This version's section of the changelog becomes the release notes.
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '$0 ~ "^## "v" " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "Agent Office $v" --notes-file notes.md
