<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Office</title>
  </head>
  <body>
    <div class="app">
      <aside class="side">
        <header class="brand">
          <div class="title">
            <h1>Agent Office</h1>
            <span class="lv" id="lv">Lv 1</span>
          </div>
          <div class="level">
            <div class="xpbar"><i id="xpbar"></i></div>
            <span class="xp" id="xptext">0 / 100 XP</span>
          </div>
          <div class="usage" id="usage" aria-label="Plan usage">
            <div class="meter" id="useSession">
              <span class="k">Session</span>
              <span class="v"></span>
              <div class="bar"><i></i></div>
              <span class="r"></span>
            </div>
            <div class="meter" id="useWeek">
              <span class="k">Week</span>
              <span class="v"></span>
              <div class="bar"><i></i></div>
              <span class="r"></span>
            </div>
            <p class="u-err" id="useErr" hidden></p>
          </div>
          <div class="usage" id="load" aria-label="What the agents are using on this machine" hidden>
            <div class="meter" id="loadCpu">
              <span class="k">CPU</span>
              <span class="v"></span>
              <div class="bar"><i></i></div>
              <span class="r"></span>
            </div>
            <div class="meter" id="loadMem">
              <span class="k">Memory</span>
              <span class="v"></span>
              <div class="bar"><i></i></div>
              <span class="r"></span>
            </div>
          </div>
        </header>
        <nav class="tabs">
          <button type="button" data-tab="chat" class="on">Chat</button>
          <button type="button" data-tab="jobs">Jobs <span id="jobCount"></span></button>
          <button type="button" data-tab="team">Team</button>
        </nav>
        <section class="pane" id="chatPane">
          <div class="msgs" id="msgs"></div>
          <div class="typing" id="typing" hidden><span></span><span></span><span></span> Chief is reading</div>
          <form class="composer" id="composer">
            <div class="ac" id="ac" hidden></div>
            <div class="tray" id="tray" hidden></div>
            <textarea id="input" rows="1" placeholder="Message the office · @agent #project" aria-label="Message the office"></textarea>
            <div class="controls">
              <button type="button" class="attach" id="attach" title="Attach files or images (or paste / drop them)" aria-label="Attach files">
                <svg viewBox="0 0 24 24"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"/></svg>
              </button>
              <input type="file" id="file" multiple hidden />
              <select id="mode" aria-label="Clearance for new work">
                <option value="plan">Plan only</option>
                <option value="edit" selected>Edit files</option>
                <option value="auto">Full autonomy</option>
              </select>
              <select id="model" aria-label="Model for new work">
                <option value="">Default model</option>
                <optgroup label="Fable">
                  <option value="claude-fable-5-1">Fable 5.1</option>
                  <option value="claude-fable-5">Fable 5</option>
                </optgroup>
                <optgroup label="Opus">
                  <option value="claude-opus-5-5">Opus 5.5</option>
                  <option value="claude-opus-5">Opus 5</option>
                  <option value="claude-opus-4-8">Opus 4.8</option>
                  <option value="claude-opus-4-7">Opus 4.7</option>
                  <option value="claude-opus-4-6">Opus 4.6</option>
                </optgroup>
                <optgroup label="Sonnet">
                  <option value="claude-sonnet-5-5">Sonnet 5.5</option>
                  <option value="claude-sonnet-5">Sonnet 5</option>
                  <option value="claude-sonnet-4-6">Sonnet 4.6</option>
                </optgroup>
                <optgroup label="Haiku">
                  <option value="claude-haiku-5-5">Haiku 5.5</option>
                  <option value="claude-haiku-4-5">Haiku 4.5</option>
                </optgroup>
              </select>
              <button class="primary small" type="submit">Send</button>
            </div>
          </form>
        </section>
        <section class="pane" id="threadPane" hidden>
          <header class="thread-head">
            <button type="button" class="link" id="threadBack">← Chat</button>
            <b>Thread</b>
          </header>
          <div class="msgs" id="threadMsgs"></div>
          <form class="composer" id="threadComposer">
            <textarea id="threadInput" rows="1" placeholder="Reply in thread" aria-label="Reply in thread"></textarea>
            <div class="controls">
              <button class="primary small" type="submit">Reply</button>
            </div>
          </form>
        </section>
        <section class="pane" id="teamPane" hidden>
          <div class="team" id="team"></div>
        </section>
        <section class="pane" id="jobsPane" hidden>
          <div class="jobs" id="jobs"></div>
          <button class="ghost" id="clear" hidden>Clear finished</button>
        </section>
      </aside>

      <main class="view" id="view">
        <div id="stage"></div>
        <div id="labels"></div>

        <div class="hud">
          <div class="chip away" id="away" hidden></div>
          <div class="chip" id="stats"></div>
          <div class="chip tools">
            <button type="button" id="turnLeft" title="Turn left (Q)" aria-label="Turn left">
              <svg viewBox="0 0 24 24"><path d="M9 7H4V2"/><path d="M4.6 7A9 9 0 1 1 3 13"/></svg>
            </button>
            <button type="button" id="turnRight" title="Turn right (E)" aria-label="Turn right">
              <svg viewBox="0 0 24 24"><path d="M15 7h5V2"/><path d="M19.4 7A9 9 0 1 0 21 13"/></svg>
            </button>
            <button type="button" id="recenter" title="Recenter (R)" aria-label="Recenter">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
            </button>
            <button type="button" id="standup" title="Call a standup" aria-label="Call a standup">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="5" cy="15" r="2"/><circle cx="19" cy="15" r="2"/><path d="M8.5 20.5a7.5 7.5 0 0 0 7 0M3.5 10.5a8.5 8.5 0 0 1 4.5-5M20.5 10.5a8.5 8.5 0 0 0-4.5-5"/></svg>
            </button>
            <span class="sep"></span>
            <button type="button" class="sound" id="sound" aria-label="Sound on" title="Sound on"></button>
          </div>
        </div>

        <div class="banner" id="banner"></div>
        <div class="toast" id="toast"></div>
        <p class="hint">Drag to move · Right-drag or Q / E to turn · Scroll to zoom · Double-click to go there</p>
      </main>

      <aside class="detail" id="detail" hidden></aside>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
