<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Office</title>
  </head>
  <body>
    <div id="stage"></div>
    <div id="labels"></div>

    <header class="top panel">
      <h1>Agent Office</h1>
      <div class="level">
        <span class="lv" id="lv">Level 1</span>
        <div class="bar"><i id="xpbar"></i></div>
        <span class="xp" id="xptext">0 / 100 XP</span>
      </div>
    </header>
    <div class="stats panel" id="stats"></div>

    <aside class="side panel">
      <nav class="tabs">
        <button type="button" data-tab="chat" class="on">Chat</button>
        <button type="button" data-tab="jobs">Jobs <span id="jobCount"></span></button>
      </nav>
      <section class="pane" id="chatPane">
        <div class="msgs" id="msgs"></div>
        <div class="typing" id="typing" hidden><span></span><span></span><span></span> Chief is reading</div>
        <form class="composer" id="composer">
          <div class="ac" id="ac" hidden></div>
          <textarea id="input" rows="1" placeholder="Message the office · @agent #project" aria-label="Message the office"></textarea>
          <div class="controls">
            <select id="mode" aria-label="Clearance for new work">
              <option value="plan">Plan only</option>
              <option value="edit" selected>Edit files</option>
              <option value="auto">Full autonomy</option>
            </select>
            <select id="model" aria-label="Model for new work">
              <option value="">Default model</option>
              <option value="opus">Opus</option>
              <option value="sonnet">Sonnet</option>
              <option value="haiku">Haiku</option>
            </select>
            <button class="primary small" type="submit">Send</button>
          </div>
        </form>
      </section>
      <section class="pane" id="jobsPane" hidden>
        <div class="jobs" id="jobs"></div>
        <button class="ghost" id="clear" hidden>Clear finished</button>
      </section>
    </aside>

    <aside class="detail panel" id="detail" hidden></aside>

    <div class="banner" id="banner"></div>
    <div class="toast" id="toast"></div>
    <p class="hint">Drag to look around · Right-drag to pan · Scroll to zoom · Click anyone to see their work</p>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
