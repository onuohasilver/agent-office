<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf9f5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Office" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Before first paint, so a saved theme never flashes the default. theme.js owns it after that.
      (function () {
        try {
          var t = localStorage.getItem('office.theme') || 'paper';
          var m = localStorage.getItem('office.mode') || 'auto';
          var d = m === 'dark' || (m === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
          var r = document.documentElement;
          r.dataset.theme = t;
          r.dataset.mode = d ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <title>Agent Office</title>
  </head>
  <body>
    <div class="app" id="app" data-m="office">
      <aside class="side">
        <header class="brand">
          <div class="title">
            <h1>Agent Office</h1>
            <span class="title-end">
              <span class="lv" id="lv">Lv 1</span>
              <button type="button" class="theme-btn" id="themeBtn" aria-label="Appearance" aria-haspopup="true" aria-expanded="false" title="Appearance">
                <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.4 0 2-.9 2-1.8 0-.9-.6-1.3-.6-2.2 0-1 .8-1.6 1.8-1.6H17a4 4 0 0 0 4-4C21 6.7 17 3 12 3z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/></svg>
              </button>
            </span>
            <div class="theme-pop" id="themePop" role="dialog" aria-label="Appearance" hidden></div>
          </div>
          <div class="level">
            <div class="xpbar"><i id="xpbar"></i></div>
            <span class="xp" id="xptext">0 / 100 XP</span>
          </div>
          <div class="usage" id="usage" aria-label="Plan usage">
            <div class="meter" id="useSession">
              <span class="k">Session</span>
              <span class="v"></span>
              <div class="bar"><i></i></div>
              <span class="r"></span>
            </div>
            <div class="meter" id="useWeek">
              <span class="k">Week</span>
              <span class="v"></span>
              <div class="bar"><i></i></div>
              <span class="r"></span>
            </div>
            <p class="u-err" id="useErr" hidden></p>
          </div>
          <div class="usage" id="load" aria-label="What the agents are using on this machine" hidden>
            <div class="meter" id="loadCpu">
              <span class="k">CPU</span>
              <span class="v"></span>
              <div class="bar"><i></i></div>
              <span class="r"></span>
            </div>
            <div class="meter" id="loadMem">
              <span class="k">Memory</span>
              <span class="v"></span>
              <div class="bar"><i></i></div>
              <span class="r"></span>
            </div>
          </div>
        </header>
        <nav class="tabs">
          <button type="button" data-tab="chat" class="on">Chat</button>
          <button type="button" data-tab="jobs">Jobs <span id="jobCount"></span></button>
          <button type="button" data-tab="projects">Projects</button>
          <button type="button" data-tab="team">Team</button>
        </nav>
        <section class="pane" id="chatPane">
          <div class="channels" id="channels" role="tablist" aria-label="Channels"></div>
          <div class="msgs" id="msgs"></div>
          <div class="typing" id="typing" hidden><span></span><span></span><span></span> Chief is reading</div>
          <form class="composer" id="composer">
            <div class="ac" id="ac" hidden></div>
            <div class="tray" id="tray" hidden></div>
            <div class="rec" id="rec" hidden><i></i><span id="recText">Recording</span><button type="button" id="recStop" class="link">Stop</button><button type="button" id="recDrop" class="link">Discard</button></div>
            <textarea id="input" rows="1" placeholder="Message the office · @agent #project" aria-label="Message the office"></textarea>
            <div class="controls">
              <button type="button" class="mic" id="mic" title="Record a voice note (hold ⌥M)" aria-label="Record a voice note">
                <svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
              </button>
              <button type="button" class="attach" id="attach" title="Attach files or images (or paste / drop them)" aria-label="Attach files">
                <svg viewBox="0 0 24 24"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"/></svg>
              </button>
              <input type="file" id="file" multiple hidden />
              <select id="mode" aria-label="Clearance for new work">
                <option value="plan">Plan only</option>
                <option value="edit" selected>Edit files</option>
                <option value="auto">Full autonomy</option>
              </select>
              <select id="model" aria-label="Model for new work">
                <option value="">Chief picks</option>
                <optgroup label="Fable">
                  <option value="claude-fable-5-1">Fable 5.1</option>
                  <option value="claude-fable-5">Fable 5</option>
                </optgroup>
                <optgroup label="Opus">
                  <option value="claude-opus-5-5">Opus 5.5</option>
                  <option value="claude-opus-5">Opus 5</option>
                  <option value="claude-opus-4-8">Opus 4.8</option>
                  <option value="claude-opus-4-7">Opus 4.7</option>
                  <option value="claude-opus-4-6">Opus 4.6</option>
                </optgroup>
                <optgroup label="Sonnet">
                  <option value="claude-sonnet-5-5">Sonnet 5.5</option>
                  <option value="claude-sonnet-5">Sonnet 5</option>
                  <option value="claude-sonnet-4-6">Sonnet 4.6</option>
                </optgroup>
                <optgroup label="Haiku">
                  <option value="claude-haiku-5-5">Haiku 5.5</option>
                  <option value="claude-haiku-4-5">Haiku 4.5</option>
                </optgroup>
              </select>
              <button class="primary small" type="submit">Send</button>
            </div>
          </form>
        </section>
        <section class="pane" id="threadPane" hidden>
          <header class="thread-head">
            <button type="button" class="link" id="threadBack">← Chat</button>
            <b id="threadWhere">Thread</b>
          </header>
          <div class="msgs" id="threadMsgs"></div>
          <form class="composer" id="threadComposer">
            <textarea id="threadInput" rows="1" placeholder="Reply in thread" aria-label="Reply in thread"></textarea>
            <div class="controls">
              <button class="primary small" type="submit">Reply</button>
            </div>
          </form>
        </section>
        <section class="pane" id="teamPane" hidden>
          <div class="team" id="team"></div>
        </section>
        <section class="pane" id="projectsPane" hidden>
          <div class="projects" id="projects"></div>
        </section>
        <section class="pane" id="jobsPane" hidden>
          <div class="jobs" id="jobs"></div>
          <button class="ghost" id="clear" hidden>Clear finished</button>
        </section>
      </aside>

      <main class="view" id="view">
        <div id="stage"></div>
        <div id="labels"></div>

        <div class="hud">
          <div class="chip away" id="away" hidden></div>
          <div class="chip" id="stats"></div>
          <div class="chip tools">
            <button type="button" id="turnLeft" title="Turn left (Q)" aria-label="Turn left">
              <svg viewBox="0 0 24 24"><path d="M9 7H4V2"/><path d="M4.6 7A9 9 0 1 1 3 13"/></svg>
            </button>
            <button type="button" id="turnRight" title="Turn right (E)" aria-label="Turn right">
              <svg viewBox="0 0 24 24"><path d="M15 7h5V2"/><path d="M19.4 7A9 9 0 1 0 21 13"/></svg>
            </button>
            <button type="button" id="recenter" title="Recenter (R)" aria-label="Recenter">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
            </button>
            <button type="button" id="standup" title="Call a standup" aria-label="Call a standup">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="5" cy="15" r="2"/><circle cx="19" cy="15" r="2"/><path d="M8.5 20.5a7.5 7.5 0 0 0 7 0M3.5 10.5a8.5 8.5 0 0 1 4.5-5M20.5 10.5a8.5 8.5 0 0 0-4.5-5"/></svg>
            </button>
            <button type="button" id="termToggle" title="Terminal (⌃`)" aria-label="Terminal">
              <svg viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="16" rx="2.5"/><path d="M7 9.5l2.6 2.5L7 14.5"/><path d="M12.6 15h4.6"/></svg>
            </button>
            <span class="sep"></span>
            <button type="button" class="sound" id="sound" aria-label="Sound on" title="Sound on"></button>
            <button type="button" class="sound" id="speak" aria-label="Read replies aloud" title="Read replies aloud"></button>
          </div>
        </div>

        <div class="banner" id="banner"></div>
        <div class="toast" id="toast"></div>
        <p class="hint">Drag to move · Right-drag or Q / E to turn · Scroll to zoom · Double-click to go there</p>

        <section class="term" id="term" hidden aria-label="Terminal">
          <div class="term-grip" id="termGrip" role="separator" aria-orientation="horizontal" aria-label="Resize the terminal" tabindex="0"></div>
          <header class="term-bar">
            <div class="term-tabs" id="termTabs" role="tablist" aria-label="Terminal sessions"></div>
            <select id="termFolder" aria-label="Folder for the next terminal"></select>
            <button type="button" class="term-icon" id="termNew" title="New terminal" aria-label="New terminal">
              <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <span class="term-fill"></span>
            <span class="term-note" id="termNote"></span>
            <button type="button" class="term-icon" id="termHide" title="Hide the terminal (⌃`)" aria-label="Hide the terminal">
              <svg viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
          </header>
          <div class="term-body" id="termBody"></div>
          <div class="term-off" id="termOff" hidden></div>
        </section>
      </main>

      <aside class="detail" id="detail" hidden></aside>

      <nav class="mnav" id="mnav" aria-label="Sections">
        <button type="button" data-m="office" class="on">
          <svg viewBox="0 0 24 24"><path d="M3 10.5L12 4l9 6.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-5h4v5"/></svg>Office
        </button>
        <button type="button" data-m="chat">
          <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>Chat<i class="dot" id="mChatDot" hidden></i>
        </button>
        <button type="button" data-m="jobs">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Jobs<b id="mJobCount"></b>
        </button>
        <button type="button" data-m="projects">
          <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Projects
        </button>
        <button type="button" data-m="team">
          <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.4"/><path d="M17 14.5a4.6 4.6 0 0 1 4 5.5"/></svg>Team
        </button>
      </nav>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
